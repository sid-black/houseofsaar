<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House of Saar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scroll-container">
        <div class="sticky-section">
            <canvas id="hero-canvas"></canvas>
            <div class="overlay-content">
                <h1 class="brand-title">HOUSE OF SAAR</h1>
                <p class="brand-subtitle">A Symphony of Warmth and Elegance</p>
            </div>
            <!-- The warm amber glow effect -->
            <div class="amber-glow"></div>
        </div>
    </div>
    
    <div class="content-section">
        <h2>Experience the Essence</h2>
        <p>A premium, minimalist palette that balances moody, dark elegance with inviting warmth.</p>
    </div>

    <!-- Catalogue Section -->
    <div class="catalogue-section">
        <h2 class="catalogue-title">Our Collection</h2>
        <div class="catalogue-grid">
            <div class="catalogue-item">
                <div class="image-wrapper">
                    <img src="https://storage.googleapis.com/mstudio-images/b704140b-da66-4a04-b88e-e65e70dae763/30d5b4a0-7f2e-4b61-9f93-dc29f0ce224a.png" alt="Chamomile">
                    <div class="hover-overlay"></div>
                </div>
                <h3>Chamomile</h3>
            </div>
            <div class="catalogue-item">
                <div class="image-wrapper">
                    <img src="https://storage.googleapis.com/mstudio-images/b704140b-da66-4a04-b88e-e65e70dae763/2cf07d87-3532-441f-a393-2775f0a3597d.png" alt="Rosemary">
                    <div class="hover-overlay"></div>
                </div>
                <h3>Rosemary</h3>
            </div>
            <div class="catalogue-item">
                <div class="image-wrapper">
                    <img src="https://storage.googleapis.com/mstudio-images/b704140b-da66-4a04-b88e-e65e70dae763/770b8c63-4415-4672-9844-32ffebcd7dfc.png" alt="Leather">
                    <div class="hover-overlay"></div>
                </div>
                <h3>Leather</h3>
            </div>
            <div class="catalogue-item">
                <div class="image-wrapper">
                    <img src="https://storage.googleapis.com/mstudio-images/b704140b-da66-4a04-b88e-e65e70dae763/2a8a1eb3-f363-42e6-a2a4-b0409a807095.png" alt="Divine Lotus">
                    <div class="hover-overlay"></div>
                </div>
                <h3>Divine Lotus</h3>
            </div>
            <div class="catalogue-item">
                <div class="image-wrapper">
                    <img src="https://storage.googleapis.com/mstudio-images/b704140b-da66-4a04-b88e-e65e70dae763/c96d5a1b-cd13-4c54-9ce5-1ad52b2e04e2.png" alt="Neem Basil Honey">
                    <div class="hover-overlay"></div>
                </div>
                <h3>Neem Basil Honey</h3>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
