<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House of Saar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scroll-container">
        <div class="sticky-section">
            <canvas id="hero-canvas"></canvas>
            <div class="overlay-content">
                <h1 class="brand-title">HOUSE OF SAAR</h1>
                <p class="brand-subtitle">A Symphony of Warmth and Elegance</p>
            </div>
            <!-- The warm amber glow effect -->
            <div class="amber-glow"></div>
        </div>
    </div>
    
    <div class="content-section">
        <h2>Experience the Essence</h2>
        <p>A premium, minimalist palette that balances moody, dark elegance with inviting warmth.</p>
    </div>

    <!-- Catalogue Section -->
    <div class="catalogue-section">
        <h2 class="catalogue-title">Our Collection</h2>
        <div class="catalogue-grid">
            <div class="catalogue-item">
                <div class="image-wrapper">
                    <img src="WhatsApp Image 2026-05-18 at 21.55.53 (1).jpeg" alt="Chamomile">
                    <div class="hover-overlay"></div>
                </div>
                <h3>Chamomile</h3>
            </div>
            <div class="catalogue-item">
                <div class="image-wrapper">
                    <img src="WhatsApp Image 2026-05-18 at 21.55.53.jpeg" alt="Rosemary">
                    <div class="hover-overlay"></div>
                </div>
                <h3>Rosemary</h3>
            </div>
            <div class="catalogue-item">
                <div class="image-wrapper">
                    <img src="WhatsApp Image 2026-05-18 at 21.55.54 (1).jpeg" alt="Leather">
                    <div class="hover-overlay"></div>
                </div>
                <h3>Leather</h3>
            </div>
            <div class="catalogue-item">
                <div class="image-wrapper">
                    <img src="WhatsApp Image 2026-05-18 at 21.55.54 (2).jpeg" alt="Divine Lotus">
                    <div class="hover-overlay"></div>
                </div>
                <h3>Divine Lotus</h3>
            </div>
            <div class="catalogue-item">
                <div class="image-wrapper">
                    <img src="WhatsApp Image 2026-05-18 at 21.55.54 (3).jpeg" alt="Neem Basil Honey">
                    <div class="hover-overlay"></div>
                </div>
                <h3>Neem Basil Honey</h3>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
